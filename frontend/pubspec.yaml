name: shattlecoach
description: "On-device badminton form coach for SNU Shattlecock club"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend / auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Local persistence (onboarding flag, cached profile)
  shared_preferences: ^2.3.3

  # Config / env
  flutter_dotenv: ^5.2.1

  # Permissions (camera, notifications)
  permission_handler: ^11.3.1

  # SVG rendering (custom icons in nav bar etc.)
  flutter_svg: ^2.0.10+1

  # Photo picking (post image attachments)
  image_picker: ^1.1.2

  # Inline video preview for AI coach (picked clip + algorithm output)
  video_player: ^2.9.2

  # On-device ML pipeline (see frontend/lib/ml/, owner: Donghwi)
  tflite_flutter: ^0.11.0   # MoveNet INT8 pose inference
  image: ^4.3.0             # JPEG decode inside the pose worker isolate
  path_provider: ^2.1.4     # temp paths used by the pipeline
  http: ^1.2.2              # optional Groq LLM coaching (rulebook works offline)
  flutter_onnxruntime: ^1.7.1  # ST-GCN stroke-confirmation classifier (QDQ INT8)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates iOS/Android launcher icons from assets/launcher/*.png
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/launcher/icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#D8F2FF"
  adaptive_icon_foreground: assets/launcher/icon_foreground.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - .env
    # On-device ML assets (loaded by frontend/lib/ml/* via rootBundle).
    - assets/movenet_lightning_int8.tflite
    - assets/bst_speed_percentiles.json
    - assets/bst_step_percentiles.json
    - assets/rule_calibration.json
    - assets/stroke_axes.json
    - assets/rulebook_tips.json
    # ST-GCN stroke-confirmation classifier (domain-adapted + QDQ-INT8 quantized)
    - assets/scorer_v3_robust_qdq_int8.onnx
    - assets/temperature.json

  # Pretendard variable font. The same file is referenced per weight so
  # `FontWeight.wN00` picks the right axis instance without manual FontVariation.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 500
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 600
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700
