name: shattlecoach
description: "On-device badminton form coach for SNU Shattlecock club"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Backend / auth
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2

  # Local persistence (onboarding flag, cached profile)
  shared_preferences: ^2.3.3

  # Config / env
  flutter_dotenv: ^5.2.1

  # Permissions (camera, notifications)
  permission_handler: ^11.3.1

  # SVG rendering (custom icons in nav bar etc.)
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  # Pretendard variable font. The same file is referenced per weight so
  # `FontWeight.wN00` picks the right axis instance without manual FontVariation.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 400
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 500
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 600
        - asset: assets/fonts/PretendardVariable.ttf
          weight: 700
