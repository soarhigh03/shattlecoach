# ── Add these to frontend/pubspec.yaml ──────────────────────────────────────
# (shared_preferences, image_picker are ALREADY in your pubspec — don't duplicate.)
#
# LLM coaching: the Groq key is injected at build time via
#   flutter build apk --dart-define=GROQ_API_KEY=<key>
# (see flutter_app/build_apk.ps1, which reads it from flutter_app/.env).
# Nothing to add to pubspec for the key — only the `http` dependency below.

dependencies:
  tflite_flutter: ^0.11.0   # MoveNet pose inference (INT8 model)
  image: ^4.3.0             # JPEG decode inside the pose worker isolate
  path_provider: ^2.1.4     # temp paths used by the pipeline
  http: ^1.2.2              # optional Groq LLM coaching (rulebook works offline without it)

flutter:
  assets:
    - assets/movenet_lightning_int8.tflite
    - assets/bst_speed_percentiles.json
    - assets/bst_step_percentiles.json
    - assets/rule_calibration.json
    - assets/stroke_axes.json
    - assets/rulebook_tips.json
